name: hardware

on:
  push:
    branches: ["main"]
    paths: ["hardware/**", "Makefile", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hardware/**", "Makefile", ".github/workflows/hardware.yml"]

jobs:
  lint-and-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilog tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator

      - name: Lint gateware (verilator -Wall)
        run: make hardware-lint

      - name: Simulate AXI peripheral
        run: make hardware-sim

      - name: Compile MMIO driver
        run: gcc -std=c99 -Wall -Wextra -Werror -fsyntax-only hardware/src/gcos_zorel_driver.c
